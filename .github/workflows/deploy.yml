# ====================================================
# FeriSmart — GitHub Actions Continuous Deployment
# Deploys static HTML/CSS/JS site automatically to GitHub Pages
# ====================================================

name: Deploy FeriSmart to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.

jobs:
  # Build & Verification job
  build-and-verify:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Github Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository root directory containing index.html, css/, js/
          path: '.'
      - name: Deploy to github Pages 
        uses: actions/deploy-pages@v4
        


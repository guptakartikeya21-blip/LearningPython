name: Static site CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-serve:
    name: Lint HTML and serve site
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install tools
        run: |
          npm install -g http-server htmlhint html-validator-cli

      - name: Run HTMLHint
        run: |
          # Lint HTML; fail the job on any errors
          htmlhint "**/*.html"

      - name: Serve site and smoke test
        run: |
          # Start a simple static HTTP server in the background
          npx http-server -p 8080 >/tmp/http-server.log 2>&1 &
          # Wait for server to be ready
          for i in {1..10}; do
            if curl -sSf http://localhost:8080 >/dev/null; then
              echo "server is up" && break
            fi
            echo "waiting for server..."; sleep 1
          done
          # Smoke test: fetch the root URL (will fail the step if non-2xx)
          curl -f http://localhost:8080

      - name: Validate HTML with W3C validator
        run: |
          # Use html-validator to run the W3C validator against the local file
          # This will print results; the step exits non-zero when a serious error occurs
          html-validator --file=index.html --verbose
